name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate runtime secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TODOIST_CLIENT_ID: ${{ secrets.TODOIST_CLIENT_ID }}
          TODOIST_CLIENT_SECRET: ${{ secrets.TODOIST_CLIENT_SECRET }}
        run: |
          node -e 'const fs = require("fs"); const secrets = { GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID || "", TODOIST_CLIENT_ID: process.env.TODOIST_CLIENT_ID || "", TODOIST_CLIENT_SECRET: process.env.TODOIST_CLIENT_SECRET || "" }; fs.writeFileSync("src/runtime-secrets.js", "window.__SAS_SECRETS__ = " + JSON.stringify(secrets, null, 2) + ";\n");'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
